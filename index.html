<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shark Hands"><meta name="theme-color" content="#000">
<title>Shark-Proof Hands</title>
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#000;color:#eaffff;font-family:-apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:14px 0 4px;color:#0ff;text-shadow:0 0 12px #0ff}
.sub{color:#c9f;margin-bottom:10px}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:#111;border:2px solid #a0f;border-radius:20px;padding:10px;text-align:center;box-shadow:0 0 12px #a0f6}
.stat b{display:block;font-size:30px;color:#0ff}
.card{background:#0b0b14;border:2px solid #0ff5;border-radius:22px;padding:12px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:20px}
.row{display:flex;gap:8px}
button{font:inherit;border:none;border-radius:20px;color:#fff;cursor:pointer}
.c{flex:1;padding:16px 4px;font-size:15px;font-weight:700;background:#1a1a2a;border:3px solid #333;min-height:84px}
.c span{display:block;font-size:30px}
.c.sel.g{background:#063;border-color:#0f8;box-shadow:0 0 16px #0f8}
.c.sel.y{background:#540;border-color:#fd0;box-shadow:0 0 16px #fd0}
.c.sel.r{background:#600;border-color:#f44;box-shadow:0 0 16px #f44}
.big{width:100%;padding:18px;font-size:19px;font-weight:700;background:#1a1a2a;border:3px solid #a0f;margin-top:8px}
.big.on{background:#40a;box-shadow:0 0 16px #a0f}
.msg{background:linear-gradient(90deg,#0ff3,#a0f3);border-radius:18px;padding:12px;font-size:17px;min-height:48px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#050510;border-top:2px solid #0ff5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:14px 0;font-size:15px;color:#9ab;border-radius:0}
nav button.act{color:#0ff;text-shadow:0 0 10px #0ff}
nav span{display:block;font-size:26px}
.scr{display:none}.scr.show{display:block}
.bar{height:26px;background:#222;border-radius:14px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0ff,#a0f)}
.ms{display:flex;align-items:center;gap:10px}
.ms .t{flex:1}.ms .t small{color:#9ab}
.pick button{padding:12px 14px;font-weight:700;margin:4px 0 0 4px}
.rw{background:#40a}.cs{background:#085}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.dot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:#222;border:2px solid #333}
.dot.g{background:#0c6}.dot.y{background:#db0;color:#000}.dot.r{background:#d33}.dot.today{border-color:#0ff;box-shadow:0 0 10px #0ff}
.undo{background:#333;border:2px solid #888}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}
.pop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:8;flex-direction:column;text-align:center;padding:20px}
.pop.show{display:flex}.pop h2{font-size:30px;color:#0ff}
</style></head><body>
<div id="today" class="scr show">
<h1>🦈 Shark-Proof Hands</h1><div class="sub" id="dlabel"></div>
<div class="stats"><div class="stat"><b id="pts">0</b>Points</div><div class="stat"><b id="stk">0</b>🟢 Streak</div></div>
<div class="msg" id="msg"></div>
<div id="slots"></div>
<div class="card"><h2>Bonus ⭐</h2>
<button class="big" id="trim">Nails trimmed ✂️ <small>(Sunday +2)</small></button>
<button class="big" id="trick">Tried a trick (fidget/polish) 🧩 <small>+2</small></button></div>
<button class="big undo" id="undo">↩️ Undo last tap</button>
</div>
<div id="rewards" class="scr"><h1>🏆 Rewards</h1><div class="sub">Total: <b id="pts2">0</b> points</div><div id="mslist"></div></div>
<div id="cal" class="scr"><h1>📅 28-Day Challenge</h1><div class="sub">Starts Thu 29 Oct 2026</div>
<div class="grid" id="grid"></div><div class="card" style="margin-top:16px">🟢 No biting · 🟡 A few slips · 🔴 Tough one · ⚪ No check-in yet</div></div>
<nav><button class="act" data-s="today"><span>🏠</span>Today</button><button data-s="rewards"><span>🏆</span>Rewards</button><button data-s="cal"><span>📅</span>Calendar</button></nav>
<div class="pop" id="pop"><h2 id="popt"></h2><p id="popp" style="font-size:18px"></p><button class="big" id="popok" style="max-width:300px">Let's go! 🚀</button></div>
<canvas id="conf"></canvas>
<script>
const START=new Date(2026,9,29),K='noahNails1';
const SLOTS=[['m','🌅 Morning'],['a','🎒 After school'],['e','🌙 Evening']];
const OPTS=[['g','🟢','No biting'],['y','🟡','A few slips'],['r','🔴','Tough one']];
const MS=[[10,'Week 1','Dinner or movie night 🍕🎬',10],[25,'Week 2','Treat or game time 🎮🍦',20],[40,'Week 3',"Day out of Noah's choice 🏄",30],[55,'Week 4','Bigger reward 🎁',50]];
let S=JSON.parse(localStorage.getItem(K)||'{"days":{},"hist":[],"ms":{}}');
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const day=k=>S.days[k]||(S.days[k]={});
function color(d){if(!d)return null;const v=['m','a','e'].map(s=>d[s]).filter(Boolean);if(!v.length)return null;return v.includes('r')?'r':v.includes('y')?'y':'g'}
function dayPts(d){const c=color(d);let p=c=='g'?3:c?1:0;if(d&&d.trim)p+=2;if(d&&d.trick)p+=2;return p}
function total(){return Object.values(S.days).reduce((a,d)=>a+dayPts(d),0)}
function streak(){let n=0,d=today();if(color(S.days[key(d)])!='g')d.setDate(d.getDate()-1);while(color(S.days[key(d)])=='g'){n++;d.setDate(d.getDate()-1)}return n}
const JOKES={g:["Sharks bite. You don't. Legend 🦈😎","Clean hands, clean streak! 🔥","Jaws is jealous of your self-control 😂","Nails: 1, Shark: 0 💪"],y:["A few slips is totally fine. Honest check-in = winning 👊","Even sharks miss sometimes. Next round is yours 🌊","Progress, not perfect. You've got this 💙"],r:["Tough one? Thanks for being honest, that still earns a point 🙌","Rough seas happen. Tomorrow's a fresh wave 🌊","Even great whites have off days. Proud you checked in 💜"],n:["Hey shark-proof legend! Tap how it's going 👇","Ready to bite... the day, not the nails? 😂🦈"]};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function render(){const t=today(),k=key(t),d=S.days[k]||{};
document.getElementById('dlabel').textContent=t.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});
document.getElementById('slots').innerHTML=SLOTS.map(([s,n])=>`<div class="card"><h2>${n}</h2><div class="row">${OPTS.map(([c,e,l])=>`<button class="c ${c} ${d[s]==c?'sel':''}" onclick="tap('${s}','${c}')"><span>${e}</span>${l}</button>`).join('')}</div></div>`).join('');
const sun=t.getDay()==0,tr=document.getElementById('trim');tr.className='big'+(d.trim?' on':'');tr.disabled=!sun;tr.style.opacity=sun?1:.4;
document.getElementById('trick').className='big'+(d.trick?' on':'');
const T=total();document.getElementById('pts').textContent=T;document.getElementById('pts2').textContent=T;document.getElementById('stk').textContent=streak();
renderMS(T);renderCal()}
function tap(s,c){const k=key(today()),d=day(k);S.hist.push({k,s,prev:d[s]??null});d[s]=c;save();document.getElementById('msg').textContent=rnd(JOKES[c]);checkMS();render()}
function bonus(f){const k=key(today()),d=day(k);S.hist.push({k,s:f,prev:d[f]??null});d[f]=!d[f];save();if(d[f])document.getElementById('msg').textContent=f=='trim'?"Fresh trim! Nothing left for the shark to chew ✂️🦈":"Trick tried = brain level up 🧩🧠";checkMS();render()}
document.getElementById('trim').onclick=()=>bonus('trim');document.getElementById('trick').onclick=()=>bonus('trick');
document.getElementById('undo').onclick=()=>{const h=S.hist.pop();if(!h){document.getElementById('msg').textContent="Nothing to undo 👌";return}const d=day(h.k);if(h.prev===null||h.prev===false)delete d[h.s];else d[h.s]=h.prev;save();document.getElementById('msg').textContent="Undone ↩️ No worries!";render()};
function renderMS(T){document.getElementById('mslist').innerHTML=MS.map(([p,w,r,c],i)=>{const got=T>=p,ch=S.ms[i];const pct=Math.min(100,T/p*100);
return `<div class="card"><div class="ms"><div class="t"><b>${got?'✅':'🔒'} ${w}: ${p}+ points</b><br><small>${r} or $${c} cash</small></div></div><div class="bar"><i style="width:${pct}%"></i></div>${got?(ch?`<div>🎉 Chosen: <b>${ch=='r'?r:'$'+c+' cash 💵'}</b></div>`:`<div class="pick"><button class="rw" onclick="pick(${i},'r')">🎁 Reward</button><button class="cs" onclick="pick(${i},'c')">💵 $${c} Cash</button></div>`):`<small>${p-T} points to go 🦈</small>`}</div>`}).join('')}
function pick(i,c){S.ms[i]=c;S.hist.push({ms:i});save();render()}
const _u=document.getElementById('undo').onclick;document.getElementById('undo').onclick=()=>{const h=S.hist[S.hist.length-1];if(h&&h.ms!==undefined){S.hist.pop();delete S.ms[h.ms];save();render();document.getElementById('msg').textContent="Undone ↩️";return}_u()};
function checkMS(){const T=total();S.seen=S.seen||{};MS.forEach(([p,w],i)=>{if(T>=p&&!S.seen[i]){S.seen[i]=1;save();celebrate(w)}})}
function celebrate(w){document.getElementById('popt').textContent='🎉 '+w+' unlocked! 🎉';document.getElementById('popp').textContent='Absolute shark-proof legend! Head to Rewards to pick Reward or Cash 🦈💵';document.getElementById('pop').classList.add('show');confetti()}
document.getElementById('popok').onclick=()=>document.getElementById('pop').classList.remove('show');
function renderCal(){const t=key(today());let h='';['M','T','W','T','F','S','S'].forEach(x=>h+=`<div style="color:#9ab">${x}</div>`);for(let i=0;i<3;i++)h+='<div></div>';
for(let i=0;i<28;i++){const d=new Date(START);d.setDate(d.getDate()+i);const k=key(d);h+=`<div class="dot ${color(S.days[k])||''} ${k==t?'today':''}">${d.getDate()}</div>`}document.getElementById('grid').innerHTML=h}
function confetti(){const c=document.getElementById('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,v:2+Math.random()*4,s:6+Math.random()*6,c:['#0ff','#a0f','#0f8','#fd0','#f4f'][Math.floor(Math.random()*5)]}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+f)/20);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<240)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(z=>z.classList.remove('act'));b.classList.add('act');document.querySelectorAll('.scr').forEach(s=>s.classList.remove('show'));document.getElementById(b.dataset.s).classList.add('show');scrollTo(0,0)});
document.getElementById('msg').textContent=rnd(JOKES.n);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
